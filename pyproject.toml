[project]
name = "remembermycontext-backend"
version = "1.0.0"
description = "RememberMyContext - Context Management API for Chrome Extension"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.38.0",
    "sqlmodel>=0.0.27",
    "sqlalchemy>=2.0.44",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "cryptography>=3.4.8",
    "pydantic[email]>=2.12.3",
    "python-dotenv>=1.1.1",
    "slowapi>=0.1.9",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

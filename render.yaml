services:
  - type: web
    name: remembermycontext-api
    runtime: python
    buildCommand: "pip install -e ."
    startCommand: "uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: remembermycontext-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FERNET_KEY
        sync: false
      - key: API_PREFIX
        value: /api/v1
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: ECHO_SQL
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: MAX_CONTEXT_LENGTH
        value: 50000

databases:
  - name: remembermycontext-db
    databaseName: remembermycontext
    user: remembermycontext
    plan: free

